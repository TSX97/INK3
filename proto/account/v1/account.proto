syntax = "proto3";

package account.v1;
option go_package = "://github.com";

service AccountService {
  rpc Register (RegUserRequest) returns (RegUserResponse);
  rpc AuthUser (AuthUserRequest) returns (AuthUserResponse);
}

message RegUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegUserResponse {
  int32 id = 1;
}

message AuthUserRequest {
  string name = 1;
  string password = 2;
}

message AuthUserResponse {
  int32 id = 1;
}

