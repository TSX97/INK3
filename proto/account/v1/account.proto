syntax = "proto3"

package account.v1;
option go_package = "github.com/TSX97/INK3/cmd/account";

service AccountService {
        rpc Register (AddUserRequest) returns (AddUserResponse);
}

message AddUserRequest {
        int32 id = 1;
        string name = 2;
        string email = 3;
}

message AddUserResponse {
        int32 id = 1;
        bool success = 2;
        string error = 3;
}
